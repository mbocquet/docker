---
# defaults file for docker

# origin of packages ; upstream (docker.com), undefined or 'default' to use
# system packages. Defaults to system packages (Debian package docker.io).
#
# docker_origin: upstream

# GPG key URL for upstream APT repository
docker_key_url: https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}/gpg

# GPG key destination for upstream APT repository
docker_key_dest: /etc/apt/keyrings/docker.asc

# Upstream APT repository URL
docker_repository_url: https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}

# docker_distribution_codename is used to force the distribution in case the
# target systems are testing or unstable. Docker repository only contains
# codenames !
# docker_distribution_codename: trixie

